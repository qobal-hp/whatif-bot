name: Trends Shorts narration (test)

on:
  push:
    branches: [trends-tts-test]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Render narration
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python3 trends_tts/add_voices.py '{"language":"hi","names":{"TR-HI-Arjun":"Arjun - Indian Hinglish","TR-HI-Anup":"Anup - Energetic"}}' | tee /tmp/added.txt
          mkdir -p /tmp/vo && cp /tmp/added.txt /tmp/vo/
      - name: Publish to the trends-tts-output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r /tmp/vo vo
          git checkout --orphan trends-tts-output
          git rm -rf --cached . > /dev/null
          git add -f vo
          git commit -q -m "Trends narration from run ${{ github.run_number }}"
          git push -f origin trends-tts-output
