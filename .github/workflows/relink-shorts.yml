name: Link shorts to their long form
on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [whatif, karma, biblia]
        default: whatif
      pairs:
        description: SHORT_ID=LONG_ID pairs, comma separated
        required: true
jobs:
  relink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ inputs.channel == 'karma' && secrets.YT_REFRESH_TOKEN_KARMA || inputs.channel == 'biblia' && secrets.YT_REFRESH_TOKEN_BIBLIA || secrets.YT_REFRESH_TOKEN }}
        run: |
          pip install --quiet google-api-python-client google-auth
          cd pipeline && case "${{ inputs.pairs }}" in list) python list_videos.py;; engage:*) python engage.py "../$(echo "${{ inputs.pairs }}" | cut -d: -f2)";; stats:*) python video_stats.py "$(echo "${{ inputs.pairs }}" | cut -d: -f2)";; *) python relink_shorts.py "${{ inputs.pairs }}";; esac
