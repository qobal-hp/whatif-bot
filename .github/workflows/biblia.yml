name: Biblia reading video

on:
  workflow_dispatch:
    inputs:
      script:
        description: Reading script
        default: biblia/genesis_01_30.txt
      max_chapters:
        description: Render only the first N chapters (empty = all)
        default: ""
      images:
        description: Image folder on the biblia-assets branch
        default: images
      tts:
        description: elevenlabs, google, gemini or gemini-api
        default: google
      verse_voice:
        description: Optional second Google voice for the verses (empty = same voice)
        default: ""
      voice:
        description: Google voice name (when tts = google)
        default: es-US-Chirp3-HD-Sulafat
      rate:
        description: Reading speed (1.0 = normal)
        default: "0.85"
      tag:
        description: Suffix for the preview branch
        default: ""
      music:
        description: Music file on the biblia-assets branch
        default: music/guitarra.mp3

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Fetch images and music
        run: |
          git fetch -q origin biblia-assets:refs/remotes/origin/biblia-assets
          mkdir -p /tmp/assets
          git --work-tree=/tmp/assets checkout origin/biblia-assets -- "${{ inputs.images }}"
          if [ "${{ inputs.music }}" = "auto" ]; then
            sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg > /dev/null && pip install -q numpy scipy
            mkdir -p /tmp/assets && python biblia/make_music.py /tmp/assets/auto "ep${{ inputs.tag }}${{ inputs.script }}" 8
          else
            git --work-tree=/tmp/assets checkout origin/biblia-assets -- "${{ inputs.music }}"
          fi
          git reset -q
          ls "/tmp/assets/${{ inputs.images }}" | head -40
      - name: Render
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BIBLIA_TTS: ${{ inputs.tts }}
          GOOGLE_VOICE: ${{ inputs.voice }}
          VERSE_VOICE: ${{ inputs.verse_voice }}
          BIBLIA_RATE: ${{ inputs.rate }}
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg > /dev/null
          python3 biblia/render.py "${{ inputs.script }}" "/tmp/assets/${{ inputs.images }}" "/tmp/assets/${{ inputs.music }}" /tmp/out "${{ inputs.max_chapters }}"
          ls -la /tmp/out
      - uses: actions/upload-artifact@v4
        with:
          name: episode${{ inputs.tag }}
          path: |
            /tmp/out/episode.mp4
            /tmp/out/chapters.txt
          retention-days: 7
      - name: Publish a preview copy when small enough
        run: |
          size=$(stat -c %s /tmp/out/episode.mp4)
          if [ "$size" -gt 95000000 ]; then echo "Preview too large ($size bytes); use the artifact"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan biblia-output${{ inputs.tag }}
          git rm -rf --cached . > /dev/null
          mkdir -p out && cp /tmp/out/episode.mp4 /tmp/out/chapters.txt out/
          git add -f out
          git commit -q -m "Biblia preview from run ${{ github.run_number }}"
          git push -f origin biblia-output${{ inputs.tag }}
