name: Karma episode

on:
  workflow_dispatch:
    inputs:
      spec:
        description: Drama spec file
        default: karma/ep01_act1.json
      assets_run:
        description: Reuse scene images from this earlier run id
        default: ""
      redo_images:
        description: Scene ids to regenerate anyway, comma separated
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json
      - name: Reuse images from an earlier run
        if: inputs.assets_run != ''
        uses: actions/download-artifact@v4
        with:
          name: assets
          path: video/public
          run-id: ${{ inputs.assets_run }}
          github-token: ${{ github.token }}
      - name: Generate dialogue and scene images
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          REDO_IMAGES: ${{ inputs.redo_images }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install --quiet fal-client
          python karma/generate_drama.py "${{ inputs.spec }}"
      - name: Add background music
        run: |
          if git fetch -q origin music-output; then
            for t in tension wonder; do
              git show "FETCH_HEAD:music/$t.mp3" > "/tmp/$t.mp3"
              len=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "/tmp/$t.mp3")
              keep=$(python3 -c "print(max(10, float('$len') - 12))")
              ffmpeg -v error -y -ss 7 -t "$keep" -i "/tmp/$t.mp3" -af loudnorm=I=-20:TP=-2:LRA=7 -ar 48000 -b:a 192k "video/public/assets/music_$t.mp3"
            done
            python3 pipeline/add_music.py "${{ inputs.spec }}" video/public/props.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assets
          path: video/public/
      - name: Render
        working-directory: video
        run: |
          npm ci --no-audit --no-fund
          mkdir -p out
          npx remotion render src/index.ts Episode out/raw.mp4 --props=public/props.json --log=warn --concurrency=100%
          ffmpeg -v error -y -i out/raw.mp4 -c:v libx264 -preset medium -crf 21 -maxrate 6M -bufsize 12M -pix_fmt yuv420p -c:a aac -b:a 192k -movflags +faststart out/episode.mp4
          ffmpeg -v error -y -i out/episode.mp4 -vf scale=854:480 -c:v libx264 -crf 27 -maxrate 900k -bufsize 1800k -c:a aac -b:a 128k -movflags +faststart out/preview.mp4
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: episode
          path: video/out/episode.mp4
      - name: Publish to the karma-output branch
        run: |
          mkdir -p /tmp/result && cp video/out/preview.mp4 video/public/props.json /tmp/result/
          size=$(stat -c %s video/out/episode.mp4); [ "$size" -lt 95000000 ] && cp video/out/episode.mp4 /tmp/result/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan karma-output
          git rm -rf --cached . > /dev/null
          rm -rf result && cp -r /tmp/result result
          git add -f result
          git commit -q -m "Karma episode from run ${{ github.run_number }}"
          git push -f origin karma-output
