name: Upload to YouTube

on:
  workflow_dispatch:
    inputs:
      episode_run:
        description: Run id of "Render episode" (leave empty to skip the long video)
        default: ""
      shorts_run:
        description: Run id of "Render shorts" (leave empty to skip shorts)
        default: ""
      channel:
        description: Which channel to upload to
        type: choice
        options: [whatif, karma, biblia, trends_in]
        default: whatif
      artifact:
        description: Name of the episode artifact
        default: episode
      spec:
        description: Episode spec file
        default: pipeline/ep01_full.json
      privacy:
        description: private, unlisted or public
        default: private
      only:
        description: Upload only these, comma separated (e.g. short1). Empty uploads everything.
        default: ""
      files_branch:
        description: Branch whose files (e.g. short1.mp4) are added to the upload (optional)
        default: ""
      schedule:
        description: Publish times in UTC, e.g. short2=2026-11-13T17:00:00Z,short3=2026-11-14T17:00:00Z
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        if: inputs.episode_run != ''
        with:
          name: ${{ inputs.artifact }}
          path: /tmp/upload
          run-id: ${{ inputs.episode_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: inputs.shorts_run != ''
        with:
          name: shorts
          path: /tmp/upload
          run-id: ${{ inputs.shorts_run }}
          github-token: ${{ github.token }}
      - name: Fetch the chosen thumbnail
        run: |
          mkdir -p /tmp/upload
          choice=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('thumbnail_choice',''))" "${{ inputs.spec }}")
          file=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('thumbnail_file',''))" "${{ inputs.spec }}")
          if [ -n "$file" ]; then cp "$file" /tmp/upload/thumb.jpg; fi
          if [ -n "${{ inputs.files_branch }}" ]; then
            git fetch -q origin "${{ inputs.files_branch }}" && git archive FETCH_HEAD | tar x -C /tmp/upload
          fi
          if [ -z "$file" ] && [ -n "$choice" ] && git fetch -q origin thumb-output; then
            git show "FETCH_HEAD:thumbs/$choice.jpg" > /tmp/upload/thumb.jpg || rm -f /tmp/upload/thumb.jpg
          fi
          ls -la /tmp/upload
      - name: Upload
        env:
          # The Trends channels use their own OAuth client (YT_CLIENT_ID_TRENDS / YT_CLIENT_SECRET_TRENDS).
          YT_CLIENT_ID: ${{ startsWith(inputs.channel, 'trends_') && secrets.YT_CLIENT_ID_TRENDS || secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ startsWith(inputs.channel, 'trends_') && secrets.YT_CLIENT_SECRET_TRENDS || secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ inputs.channel == 'karma' && secrets.YT_REFRESH_TOKEN_KARMA || inputs.channel == 'biblia' && secrets.YT_REFRESH_TOKEN_BIBLIA || inputs.channel == 'trends_in' && secrets.YT_REFRESH_TOKEN_IN || !startsWith(inputs.channel, 'trends_') && secrets.YT_REFRESH_TOKEN || '' }}
        run: |
          if [ -z "$YT_REFRESH_TOKEN" ]; then echo "No upload token for channel ${{ inputs.channel }} (karma needs YT_REFRESH_TOKEN_KARMA, biblia needs YT_REFRESH_TOKEN_BIBLIA, trends_in needs YT_REFRESH_TOKEN_IN)"; exit 1; fi
          pip install --quiet google-api-python-client google-auth
          python pipeline/upload_youtube.py "${{ inputs.spec }}" /tmp/upload "${{ inputs.privacy }}" "${{ inputs.only }}" "${{ inputs.schedule }}"
