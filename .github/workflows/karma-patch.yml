name: Karma patch scenes

# Redraws a few scenes of a finished episode and re-renders only those seconds,
# instead of rendering the whole episode again. The voices, music and timing are kept.

on:
  workflow_dispatch:
    inputs:
      spec:
        description: Drama spec file
        default: karma/ep01_full.json
      episode_run:
        description: Run id of the finished episode (Karma episode or an earlier patch)
        required: true
      scenes:
        description: Scene ids to redraw, comma separated
        required: true
      new_images:
        description: Make new pictures for these scenes (no = re-render only)
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: assets
          path: video/public
          run-id: ${{ inputs.episode_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: episode
          path: /tmp/old
          run-id: ${{ inputs.episode_run }}
          github-token: ${{ github.token }}
      - name: Redraw the scenes
        if: inputs.new_images
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          REDO_IMAGES: ${{ inputs.scenes }}
          IMAGES_ONLY: "1"
        run: |
          pip install --quiet fal-client
          python karma/generate_drama.py "${{ inputs.spec }}"
      - uses: actions/upload-artifact@v4
        with:
          name: assets
          path: video/public/
      - name: Render only the changed seconds
        working-directory: video
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          npm ci --no-audit --no-fund
          mkdir -p out
          fps=$(python3 -c "import json;print(json.load(open('public/props.json'))['fps'])")
          python3 ../pipeline/patch_ranges.py public/props.json "${{ inputs.scenes }}" > out/ranges.txt
          cat out/ranges.txt
          inputs=(-i /tmp/old/episode.mp4); filter=""; prev="0:v"; n=0
          while read a b; do
            n=$((n+1))
            npx remotion render src/index.ts Episode "out/seg$n.mp4" --props=public/props.json --frames=$a-$b --muted --log=warn --concurrency=100%
            inputs+=(-i "out/seg$n.mp4")
            filter+="[$n:v]setpts=PTS-STARTPTS+$a/$fps/TB[s$n];[$prev][s$n]overlay=eof_action=pass:enable='between(n,$a,$b)'[v$n];"
            prev="v$n"
          done < out/ranges.txt
          ffmpeg -v error -y "${inputs[@]}" -filter_complex "${filter%;}" -map "[$prev]" -map 0:a -c:v libx264 -preset fast -crf 21 -maxrate 6M -bufsize 12M -pix_fmt yuv420p -c:a copy -movflags +faststart out/episode.mp4
          ffmpeg -v error -y -i out/episode.mp4 -vf scale=854:480 -c:v libx264 -crf 27 -maxrate 900k -bufsize 1800k -c:a aac -b:a 128k -movflags +faststart out/preview.mp4
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: episode
          path: video/out/episode.mp4
      - name: Publish to the karma-output branch
        run: |
          mkdir -p /tmp/result && cp video/out/preview.mp4 video/public/props.json /tmp/result/
          size=$(stat -c %s video/out/episode.mp4); [ "$size" -lt 95000000 ] && cp video/out/episode.mp4 /tmp/result/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan karma-output
          git rm -rf --cached . > /dev/null
          rm -rf result && cp -r /tmp/result result
          git add -f result
          git commit -q -m "Karma patch from run ${{ github.run_number }}"
          git push -f origin karma-output
