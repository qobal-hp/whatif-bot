name: Render episode

on:
  workflow_dispatch:
    inputs:
      spec:
        description: Episode spec file
        default: pipeline/ep01_coldopen.json
      assets_run:
        description: Reuse narration, images and clips from this earlier run id (no new generation)
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Generate narration, images and clips
        if: inputs.assets_run == ''
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          pip install --quiet fal-client
          python pipeline/generate_assets.py "${{ inputs.spec }}"
      - name: Reuse the assets of an earlier run
        if: inputs.assets_run != ''
        uses: actions/download-artifact@v4
        with:
          name: assets
          path: video/public
          run-id: ${{ inputs.assets_run }}
          github-token: ${{ github.token }}
      - name: Add background music
        run: |
          if git fetch -q origin music-output; then
            mkdir -p video/public/assets
            for t in tension wonder; do
              git show "FETCH_HEAD:music/$t.mp3" > "/tmp/$t.mp3"
              # Drop the quiet intro and the ending, and bring both tracks to the same loudness.
              len=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "/tmp/$t.mp3")
              keep=$(python3 -c "print(max(10, float('$len') - 12))")
              ffmpeg -v error -y -ss 7 -t "$keep" -i "/tmp/$t.mp3" -af loudnorm=I=-20:TP=-2:LRA=7 -ar 48000 -b:a 192k "video/public/assets/music_$t.mp3"
            done
            python3 pipeline/add_music.py "${{ inputs.spec }}" video/public/props.json
          else
            echo "No music tracks published yet; rendering without music"
          fi
      - name: Keep the generated assets even if rendering fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assets
          path: video/public/
          if-no-files-found: warn
      - name: Render video
        working-directory: video
        run: |
          npm ci --no-audit --no-fund
          npx remotion render src/index.ts Episode out/raw.mp4 --props=public/props.json --concurrency=100% --log=warn \
            || npx remotion render src/index.ts Episode out/raw.mp4 --props=public/props.json --concurrency=100% --log=warn \
                 --browser-executable="$(which google-chrome)"
          ffmpeg -v error -y -i out/raw.mp4 -c:v libx264 -preset medium -crf 20 -maxrate 9M -bufsize 18M \
            -pix_fmt yuv420p -c:a aac -b:a 192k -movflags +faststart out/episode.mp4
          ffmpeg -v error -y -i out/raw.mp4 -vf scale=854:480 -c:v libx264 -preset medium -crf 30 -maxrate 900k -bufsize 1800k \
            -pix_fmt yuv420p -c:a aac -b:a 96k -movflags +faststart out/preview.mp4
          ls -la out
      - name: Full-quality video (download from this run's Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: episode
          path: video/out/episode.mp4
      - name: Publish a small preview to the sample-output branch
        run: |
          mkdir -p /tmp/result && cp video/out/preview.mp4 video/public/props.json /tmp/result/
          if [ "$(stat -c%s video/out/episode.mp4)" -lt 95000000 ]; then cp video/out/episode.mp4 /tmp/result/; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan sample-output
          git rm -rf --cached . > /dev/null
          rm -rf result && cp -r /tmp/result result
          git add -f result
          git commit -q -m "Render from run ${{ github.run_number }}"
          git push -f origin sample-output
