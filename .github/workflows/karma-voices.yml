name: Karma voice casting

on:
  workflow_dispatch:
    inputs:
      spec:
        description: Casting spec
        default: karma/voice_casting.json

permissions:
  contents: write

jobs:
  cast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Search the voice library and audition
        if: inputs.spec != 'spanish-sample' && inputs.spec != 'secret-check'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python karma/voice_casting.py "${{ inputs.spec }}" /tmp/voices
      - name: Which Google keys are set
        if: inputs.spec == 'secret-check'
        env:
          A: ${{ secrets.GOOGLE_TTS_API_KEY }}
          B: ${{ secrets.GEMINI_API_KEY }}
          C: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_TTS_SA_JSON: ${{ secrets.GOOGLE_TTS_SA_JSON }}
        run: |
          pip install --quiet google-auth requests && python karma/es/check_tts.py && python karma/es/pace_test.py
          echo "GOOGLE_TTS_API_KEY set: ${A:+yes}"; echo "GEMINI_API_KEY set: ${B:+yes}"; echo "GOOGLE_API_KEY set: ${C:+yes}"
          for k in "$A" "$B" "$C"; do [ -n "$k" ] || continue; code=$(curl -s -o /tmp/r.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' "https://texttospeech.googleapis.com/v1/text:synthesize?key=$k" -d '{"input":{"prompt":"Say it warmly","text":"Hola"},"voice":{"languageCode":"es-MX","name":"Kore","modelName":"gemini-2.5-flash-tts"},"audioConfig":{"audioEncoding":"MP3"}}'); echo "cloud tts with key: $code $(head -c 300 /tmp/r.json | tr -d '\n')"; done
      - name: Install ffmpeg
        if: inputs.spec == 'spanish-sample'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Spanish dub sample (Gemini TTS and ElevenLabs)
        if: inputs.spec == 'spanish-sample'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ONLY: gemini
        run: python karma/es/sample.py /tmp/voices
      - name: Publish to the karma-voices-output branch
        run: |
          cp -r /tmp/voices voices
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan karma-voices-output
          git rm -rf --cached . > /dev/null
          git add -f voices
          git commit -q -m "Voice casting from run ${{ github.run_number }}"
          git push -f origin karma-voices-output
