name: Update YouTube videos

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Which channel the videos are on
        type: choice
        options: [whatif, karma, karma-es]
        default: whatif
      changes:
        description: 'JSON list, e.g. [{"id":"abc","title":"New title"},{"id":"def","publish_at":"2026-11-15T17:00:00Z"}]'
        required: true

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ inputs.channel == 'karma' && secrets.YT_REFRESH_TOKEN_KARMA || inputs.channel == 'karma-es' && secrets.YT_REFRESH_TOKEN_ES || secrets.YT_REFRESH_TOKEN }}
          CHANGES: ${{ inputs.changes }}
        run: |
          pip install --quiet google-api-python-client google-auth
          cd pipeline && if [ "$CHANGES" = "list" ]; then python channel_uploads.py; else python update_youtube.py "$CHANGES"; fi
