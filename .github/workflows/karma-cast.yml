name: Karma cast audition

on:
  workflow_dispatch:
    inputs:
      test:
        description: cast = voice audition, dialogue = conversation test
        default: cast
      roles_file:
        description: For the design test, a roles JSON file (empty uses the built-in roles)
        default: ""
      narrators:
        description: For the narrator test, comma-separated voice names
        default: George,Brian,Bill

permissions:
  contents: write

jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Render the cast
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          NARRATORS: ${{ inputs.narrators }}
          ROLES_FILE: ${{ inputs.roles_file }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          if [ "${{ inputs.test }}" = create ]; then if [ -n "${{ inputs.roles_file }}" ]; then python3 karma/create_voices.py "${{ inputs.roles_file }}" "${{ inputs.narrators }}" KT; else python3 karma/create_voices.py karma/ep05_voice_designs.json "${{ inputs.narrators }}" EP05; fi; elif [ "${{ inputs.test }}" = design ]; then python3 karma/voice_design_test.py /tmp/cast; elif [ "${{ inputs.test }}" = narrator ]; then python3 karma/narrator_test.py /tmp/cast; elif [ "${{ inputs.test }}" = dialogue ]; then python3 karma/dialogue_test.py /tmp/cast; elif [ "${{ inputs.test }}" = sfx ]; then python3 karma/sfx_test.py /tmp/cast; else python3 karma/cast_audition.py karma/cast_audition.json /tmp/cast; fi
      - name: Publish to the karma-cast branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan karma-cast
          git rm -rf --cached . > /dev/null
          rm -rf cast && cp -r /tmp/cast cast
          git add -f cast
          git commit -q -m "Cast audition from run ${{ github.run_number }}"
          git push -f origin karma-cast
