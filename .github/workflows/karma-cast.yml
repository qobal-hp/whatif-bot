name: Karma cast audition

on:
  workflow_dispatch:
    inputs:
      test:
        description: cast = voice audition, dialogue = conversation test
        default: cast

permissions:
  contents: write

jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Render the cast
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          if [ "${{ inputs.test }}" = narrator ]; then python3 karma/narrator_test.py /tmp/cast; elif [ "${{ inputs.test }}" = dialogue ]; then python3 karma/dialogue_test.py /tmp/cast; elif [ "${{ inputs.test }}" = sfx ]; then python3 karma/sfx_test.py /tmp/cast; else python3 karma/cast_audition.py karma/cast_audition.json /tmp/cast; fi
      - name: Publish to the karma-cast branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan karma-cast
          git rm -rf --cached . > /dev/null
          rm -rf cast && cp -r /tmp/cast cast
          git add -f cast
          git commit -q -m "Cast audition from run ${{ github.run_number }}"
          git push -f origin karma-cast
